services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-asistencia}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env antes de iniciar Docker Compose}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-asistencia}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env antes de iniciar Docker Compose}
      QUEUE_CONNECTION: database
    command: ["sh", "-lc", "exec php artisan queue:work database --sleep=3 --tries=3 --timeout=90 --no-interaction"]
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-asistencia}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env antes de iniciar Docker Compose}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  node-tests:
    image: node:20-alpine
    profiles: ["test"]
    working_dir: /workspace
    command: ["sh", "-c", "npm install --no-package-lock --no-audit --no-fund && npm test"]
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules

  php-tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      APP_KEY: "base64:VGhpc0lzQVN1aXRhYmxlQXBwS2V5Rm9yVGVzdHMxMjM="
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SESSION_DRIVER: array
      SESSION_ENCRYPT: "false"
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      BCRYPT_ROUNDS: "4"
    command: ["php", "vendor/bin/phpunit", "--no-coverage"]
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor

  postgres-tests:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: asistencia_test
      POSTGRES_USER: asistencia_test
      POSTGRES_PASSWORD: test-only-password
      TZ: UTC
      PGTZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

  php-postgres-tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      APP_KEY: "base64:VGhpc0lzQVN1aXRhYmxlQXBwS2V5Rm9yVGVzdHMxMjM="
      DB_CONNECTION: pgsql
      DB_HOST: postgres-tests
      DB_PORT: 5432
      DB_DATABASE: asistencia_test
      DB_USERNAME: asistencia_test
      DB_PASSWORD: test-only-password
      DB_TIMEZONE: UTC
      SESSION_DRIVER: array
      SESSION_ENCRYPT: "false"
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      BCRYPT_ROUNDS: "4"
    command: ["php", "vendor/bin/phpunit", "--no-coverage"]
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres-tests:
        condition: service_healthy

volumes:
  composer_vendor:
  node_modules:
  postgres_data:
